server {
    listen 80;
    server_name aetherstream.local localhost;

    # Change this line to point to your actual project path:
    root /mnt/d/Devops/aetherstream-portal/site;
    index index.html index.htm;

    access_log /var/log/nginx/aetherstream_access.log;
    error_log /var/log/nginx/aetherstream_error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    
    location ~ /\. {
        deny all;
    }
}
