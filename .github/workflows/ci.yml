name: AetherStream CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx

      - name: Deploy Site to Test Path
        run: |
          sudo mkdir -p /var/www/aetherstream/site
          sudo cp -r site/* /var/www/aetherstream/site/
          sudo chown -R www-data:www-data /var/www/aetherstream

      - name: Configure Nginx Test Server Block
        run: |
          sudo cp conf/nginx.conf /etc/nginx/sites-available/aetherstream.conf
          # Update root path in config for CI environment if needed, or link it
          sudo ln -s /etc/nginx/sites-available/aetherstream.conf /etc/nginx/sites-enabled/
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl restart nginx

      - name: Run Health Check Script
        run: |
          chmod +x scripts/health-check.sh
          # Test local endpoint via curl
          curl -I http://localhost/index.html
          curl -I http://localhost/health.html
          # Execute the automated verification script
          ./scripts/health-check.sh